apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init
data:
  001-enable-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS timescaledb;
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb:2.24.0-pg17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: db
          env:
            - name: POSTGRES_DB
              value: devoteam
            - name: POSTGRES_USER
              value: devoteam
            - name: POSTGRES_PASSWORD
              value: devoteam
          args:
            - postgres
            - -c
            - shared_preload_libraries=timescaledb,pg_stat_statements
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d/001-enable-extensions.sql
              subPath: 001-enable-extensions.sql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U devoteam -d devoteam
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U devoteam -d devoteam
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init
          configMap:
            name: timescaledb-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: db
      port: 5432
      targetPort: db
