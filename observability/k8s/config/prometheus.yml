global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager.devo-carre-observability.svc.cluster.local:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: devo-carre-backend
    metrics_path: /actuator/prometheus
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [devoteam]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: dc-backend
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http

  - job_name: postgres-exporter
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [devo-carre-observability]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: postgres-exporter

  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [devo-carre-observability]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: node-exporter

  - job_name: kube-state-metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [devo-carre-observability]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: kube-state-metrics

  - job_name: alloy
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [devo-carre-observability]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: alloy
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http

  - job_name: loki
    static_configs:
      - targets: [loki.devo-carre-observability.svc.cluster.local:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo.devo-carre-observability.svc.cluster.local:3200]

  - job_name: kubernetes-cadvisor
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        regex: (.+)
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
