apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels: {app.kubernetes.io/name: alloy}
spec:
  selector: {app.kubernetes.io/name: alloy}
  ports:
    - name: http
      port: 12345
      targetPort: http
    - name: faro
      port: 12347
      targetPort: faro
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: {app.kubernetes.io/name: alloy}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: alloy}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alloy}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.8.3
          args:
            - run
            - /etc/alloy/alloy.alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - name: http
              containerPort: 12345
            - name: faro
              containerPort: 12347
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap: {name: alloy-config}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels: {app.kubernetes.io/name: postgres-exporter}
spec:
  selector: {app.kubernetes.io/name: postgres-exporter}
  ports:
    - name: http
      port: 9187
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels: {app.kubernetes.io/name: postgres-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres-exporter}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres-exporter}
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          envFrom:
            - secretRef: {name: postgres-exporter-credentials}
          ports:
            - name: http
              containerPort: 9187
          readinessProbe:
            httpGet: {path: /metrics, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  labels: {app.kubernetes.io/name: node-exporter}
spec:
  selector: {app.kubernetes.io/name: node-exporter}
  ports:
    - name: http
      port: 9100
      targetPort: http
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels: {app.kubernetes.io/name: node-exporter}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: node-exporter}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: node-exporter}
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:9100
          ports:
            - name: http
              containerPort: 9100
              hostPort: 9100
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
      volumes:
        - name: proc
          hostPath: {path: /proc}
        - name: sys
          hostPath: {path: /sys}
        - name: root
          hostPath: {path: /}
---
